# 通用数学题库多维标签受控词表模板（精简实用版）
# 说明：
#   1. 本模板默认内置小学奥数 / 竞赛数学 7 大板块、57 专题、44 解题方法、1~4 级整数难度、5 视觉类型与 5 题型。
#   2. 可直接被 `scripts/validate_enriched.py` 加载通过；新书若面向初中/高中数学，可按需增删 `domains`、`topics` 与 `methods`（支持任意分组层级或平铺列表）。
#   3. 仅对原题题干与配图进行多维标签标注，不输出解析、答案，不区分例题与练习题，不保留竞赛出处字段。

meta:
  version: "1.0.0"
  book_title: "通用数学题库模板（请替换为实际书名）"
  total_chapters: 0  # 请按实际全书总章数修改
  scope: "仅对原题题干与配图进行多维标签标注，不输出解析、答案，不区分例题与练习题；题号采用中性的按章纯顺序编号（如 `ch01_001`）。"
  design_principles:
    - "精简实用：控制受控词表总规模，杜绝同义词与近义词重复。"
    - "正交解耦：topic 回答“考什么题型/场景”，method 回答“用什么思想/招式破局”，二者严格不重名、不机械映射。"
    - "规则继承 + LLM 精标：可先由 chapter_mapping 自动继承 domain 与候选 topic，再由 LLM 结合题干与配图精标 method、difficulty、visual、format 与跨板块 topic。"
    - "受控为主 + 开放补充：核心检索依赖受控词表，长尾知识点通过 extra_tags 有限补充，定期汇总升级。"

# 通用章节映射示例（供新书 Stage 1 `extract_raw.py` 继承主 domain 与候选 topic；请按新书实际目录定制）
# 提示：小学奥数 / 初中数学 / 高中数学可在此映射每章所属主板块与候选专题，并按需扩充下方 topics 与 methods。
chapter_mapping:
  1:
    chapter_title: "第一章 计算基础与运算律（示例）"
    domain: "计算"
    candidate_topics: ["四则运算与算式巧算"]
  2:
    chapter_title: "第二章 平面直线图形面积（示例）"
    domain: "几何"
    candidate_topics: ["三角形比例与等积模型", "规则与格点直线面积"]
  3:
    chapter_title: "第三章 质数合数与因数分解（示例）"
    domain: "数论"
    candidate_topics: ["质数、合数与分解质因数", "因数个数与因数和"]

schema_rules:
  domain:
    required: true
    type: "single" # 单选主板块；跨板块综合题以核心考点为准，辅知识点由 topic/method 体现
    min: 1
    max: 1
    enum_source: "domains.*.name"
    auto_inherit_rule: "可先根据 chapter_mapping 映射默认主 domain，跨板块综合题由 LLM 按题目实质修正。"
  topic:
    required: true
    type: "multi"
    min: 1
    max: 2
    enum_source: "topics.*.*.name"
    desc: "第 1 个（主专题）必须属于 topics.<domain>；仅当题目明显跨板块综合时，允许第 2 个专题从其他板块的 topics 中选取（全题最多 2 个）。"
  method:
    required: true
    type: "multi"
    min: 1
    max: 3
    enum_source: "methods.*.*.name"
    desc: "打标时统一写入平铺数组 method（不区分通用与专项分组），建议 1 个核心思想 + 1~2 个专项技巧，最多不超过 3 个。"
  difficulty:
    required: true
    type: "single"
    value_type: "integer" # 统一存储整数 1 / 2 / 3 / 4
    min: 1
    max: 1
    enum_source: "difficulty.*.level"
  visual:
    required: true
    type: "single"
    min: 1
    max: 1
    enum_source: "visual.*.name"
    pipeline_routing: "当 visual != '纯文字' 时，调用 LLM 打标或自动解题必须走多模态（传入对应图片）。"
  format:
    required: true
    type: "single"
    min: 1
    max: 1
    enum_source: "format.*.name"
    auto_extract_hint: "优先由正则基于题干标点与关键词自动抽取，无法判定时回退至 LLM 识别。"
  extra_tags:
    required: false
    type: "multi"
    min: 0
    max: 2
    governance:
      - "仅当受控词表无法覆盖题目特有概念（如特定定理、经典母题名、特殊赛制等，如“鸡爪模型”“数字谜”“斐波那契数列”“博弈必胜”）时使用。"
      - "禁止填入 domains/topics/methods/difficulty/visual/format 中已存在概念的同义词或缩写。"
      - "格式要求：2~8个汉字或标准数学名词，不加#号，全库高频出现（>=15次）时方可评审升格为正式词表项。"

domains:
  - name: "计算"
    desc: "整数、小数、分数四则运算、运算律简算、数列与代数公式化简。"
  - name: "应用题"
    desc: "经典模型应用题及分数、比例、工程、浓度、经济利润应用题。"
  - name: "行程"
    desc: "单人及多人相遇追及、火车过桥、流水行船、变速走停、比例行程与时钟行程。"
  - name: "逻辑推理"
    desc: "真假判断、多维属性匹配、大小排序、位置推演及数字/算式逻辑推理。"
  - name: "几何"
    desc: "直线图形角度/周长/面积、五大面积比例模型、勾股弦图、圆与扇形及立体几何。"
  - name: "数论"
    desc: "整除特征、位值原理、质合数与分解质因数、因数性质、公因公倍与同余问题。"
  - name: "计数与组合"
    desc: "有序枚举、加乘原理、标数递推、排列组合、容斥、组合构造、抽屉与极值。"

# 说明：以下 57 个专题按 7 大板块分组；若用于初中/高中题库（如函数、三角、解析几何、导数、立体向量等），可按同样结构增删或替换。
topics:
  计算:
    - name: "四则运算与算式巧算"
      desc: "整数四则基础、和差积商不变性质、运算律简算与添去括号计算。"
    - name: "小数与分数四则技巧"
      desc: "小数点移位、分数四则运算、约分通分及运算律在分小数混合运算中的应用。"
    - name: "循环小数与分数互化"
      desc: "纯循环、混循环小数化分数，分数化小数及循环节位数周期计算。"
    - name: "分式抵消与繁分数化简"
      desc: "分数与整数裂项相消求和（含多因数分母裂项），以及多层繁分数化简。"
    - name: "等差数列与特殊求和"
      desc: "等差数列项数/通项/求和、奇数项特征、连续自然数平方和及数列规律求和。"
    - name: "等比数列与幂次运算"
      desc: "等比数列求和、错位相减及指数幂次式化简。"
    - name: "代数公式与复杂式化简"
      desc: "平方差、完全平方、多项式乘法展开及需要整体代换的大型复杂算式。"

  应用题:
    - name: "归一与复合数量关系"
      desc: "单一量归一、复归一、基本份数关系及多步数量因果推导。"
    - name: "平均数与移多补少"
      desc: "算术平均数求解、部分与整体平均数换算及平均数背景下的推理与极值。"
    - name: "周期与日历问题"
      desc: "数列/图形/星期与日历周期规律推算（含闰年天数与带余周期）。"
    - name: "植树与间隔问题"
      desc: "封闭/非封闭路线植树及锯木头、敲钟、爬楼梯、方阵间隔等广义间隔问题。"
    - name: "逆向过程还原问题"
      desc: "已知经过多步运算或操作后的最终状态，求初始数量的应用题。"
    - name: "和差倍问题"
      desc: "已知两个或多个量的和、差、倍数关系求各量（不含年龄专项）。"
    - name: "年龄问题"
      desc: "以多人年龄差不变、跨年份年龄和倍关系为核心的时间推算应用题。"
    - name: "鸡兔同笼与多量置换"
      desc: "两量及三量鸡兔同笼、得分扣分及等价置换类数量分配问题。"
    - name: "盈亏问题"
      desc: "按不同标准分配同一批物品产生“盈/亏/恰好”，求分配对象数与总量。"
    - name: "牛吃草与动态消长问题"
      desc: "原有存量叠加均匀自然增长（或减少）与外界消耗共同作用的动态平衡问题。"
    - name: "分数与百分数应用题"
      desc: "单位“1”识别、多阶段分率转化与具体数量对应求解。"
    - name: "比和比例应用题"
      desc: "连比化简、按比分配、正反比例关系、复合比及混合比问题。"
    - name: "工程与效率周期问题"
      desc: "工作总量/效率/时间计算、多人合作、轮流交替周期工程及水管进排水。"
    - name: "浓度配比问题"
      desc: "溶液稀释、加溶质/蒸发提纯、多杯混合与倒出再注满等浓度变化问题。"
    - name: "经济利润问题"
      desc: "成本、定价、折扣、促销方案对比及利润率增减计算。"

  行程:
    - name: "基本行程与相遇追及"
      desc: "路程速度时间三要素关系、单次直线相遇与追及、路程和差问题。"
    - name: "多人与多次相遇问题"
      desc: "直线往返多次相遇、三人及以上联立相遇追及、环形跑道周期相遇与追及。"
    - name: "火车过桥与错车问题"
      desc: "计入车长的过桥、过隧道、错车、超车及车尾人与列车相对运动。"
    - name: "流水行船问题"
      desc: "静水速、水速与顺逆水速度转换，及流水环境中的相遇追及与漂流。"
    - name: "比例行程与变速走停"
      desc: "利用路/速/时正反比解行程、中途变速、间歇走停及含假设调整的复杂行程。"
    - name: "时钟与数论综合行程"
      desc: "钟表指针重合/成角追及、扶梯与发车间隔、结合整除余数的竞赛行程。"

  几何:
    - name: "角度计算与多边形性质"
      desc: "点线角基础、三角形内外角和、多边形内角和/外角和及基本概念公式。"
    - name: "平面图形周长巧算"
      desc: "规则与凹凸/阶梯状直线图形周长计算、周长比较与周长极值。"
    - name: "规则与格点直线面积"
      desc: "长正方形/平行四边形/梯形基础面积巧算、格点面积及初步直线切拼。"
    - name: "三角形比例与等积模型"
      desc: "平行线等积、共边/鸟头/蝶形/一半模型及平行线截线段成比例（相似）。"
    - name: "勾股定理与弦图问题"
      desc: "直角三角形三边勾股关系、弦图构型面积及勾股数组应用。"
    - name: "平面直线图形综合与切拼"
      desc: "复杂直线图形割补拼接、对称与旋转变换、正多边形及直线几何综合。"
    - name: "圆与扇形的弧长及轨迹"
      desc: "圆、扇形、弓形周长与弧长计算，以及图形滚动/旋转产生的点线运动轨迹。"
    - name: "曲线图形面积与组合"
      desc: "圆与方嵌套（圆中方/方中圆）、叶形/月牙形面积及旋转扫过面积。"
    - name: "立体图形表面积与体积"
      desc: "长正方体、棱柱棱锥、圆柱圆锥及球的表面积、体积、容积与物体浸没问题。"
    - name: "立体展开图、三视图与切拼染色"
      desc: "正方体/棱柱展开图、三视图观察、堆垒切割表面积变化、正方体截面与染色。"

  数论:
    - name: "整除性质与数字特征"
      desc: "整除基本性质、常见倍数特征（2/3/4/5/7/8/9/11/13/25/125）及数字谜整除筛选。"
    - name: "位值原理与进制数字"
      desc: "多位数十进制位值展开、数字重排求和差及按位构造整数问题。"
    - name: "质数、合数与分解质因数"
      desc: "质合数判定、奇偶质数性质、算术基本定理质因数分解及乘积末尾零/平方数构造。"
    - name: "因数个数与因数和"
      desc: "求正整数因数个数、因数之和、完全平方数因数个数特征及完全数/亲和数。"
    - name: "公因数与公倍数问题"
      desc: "最大公因数与最小公倍数计算、已知 GCD/LCM 反推原数及多周期对齐问题。"
    - name: "带余除法与同余问题"
      desc: "余数基本关系、同余加乘幂性质、余数周期及中国剩余定理（物不知数）。"
    - name: "数论综合与构造推理"
      desc: "数论结合抽屉原理、极端构造、大小放缩及数论竞赛综合问题。"

  计数与组合:
    - name: "枚举计数与树状列表"
      desc: "数字/运算/棋子摆放的有序分类枚举，以及借助树状图和表格的穷举计数。"
    - name: "加乘原理与标数递推"
      desc: "分类加法与分步乘法计数、网格最短路径标数、染色及环形传球递推。"
    - name: "排列组合与对应计数"
      desc: "有无重复的排列与组合、相邻/不相邻约束及一一对应等价转化计数。"
    - name: "多集合重叠计数"
      desc: "二元/三元集合交叉重叠计数及集合重叠极值（最多/最少）问题。"
    - name: "数论与图形类专项计数"
      desc: "满足质数/整除/位值条件的数字计数、数阵填数计数，以及几何图形计数与染色放置。"
    - name: "组合构造问题"
      desc: "按规则构造满足和/积/奇偶/覆盖/切拼要求的数量方案或网格填数。"
    - name: "抽屉与存在性问题"
      desc: "抽屉原理、最不利确保问题，以及构造区间/剩余类/几何/染色抽屉证明存在性。"
    - name: "组合极值与统筹优化"
      desc: "组合与数论场景下的最大/最小值求解、统筹安排及临界极端情况分析。"

  逻辑推理:
    - name: "属性匹配与关系推理"
      desc: "多人多属性（姓名/职业/名次/项目）配对及胜负赛程关系网推演。"
    - name: "真假话与悖论推理"
      desc: "谁说真话/假话、一真一假、部分真假、说谎者悖论及认知推理（知道与不知道）。"
    - name: "数字与算式逻辑推理"
      desc: "通过数独、横竖式数字谜、密码猜测与得分条件反推唯一数字组合。"
    - name: "大小排序与位置推理"
      desc: "身高/体重/成绩比较排序，以及圆桌、排队、方位顺序推演。"

# 说明：validate_enriched.py 支持双层分组、任意自定义分组以及平铺列表三种 methods 结构。
methods:
  通用数学思想:
    - name: "不变量思想"
      desc: "抓住变化过程中的和/差/积/商不变、年龄差不变、总量不变、溶质不变或面积差不变破局。"
      boundary: "核心是找“谁没变”；若通过改写表达形式化简，归入转化与化归。"
    - name: "转化与化归"
      desc: "将陌生、非线性或跨板块问题等价转化为已知标准模型或更简单的形式。"
      boundary: "用于跨模型降维或等价变式。"
    - name: "假设法"
      desc: "先对未知数量、分配方式或真假命题作出试探性假定，再依据差额或矛盾修正。"
      boundary: "区别于反证法：假设法重在算术调差（如鸡兔假设全鸡、工程假设全程合作）。"
    - name: "逆推法"
      desc: "从已知结果或终点状态出发，沿着时间或运算的逆向顺序逐步倒推还原初始条件。"
      boundary: "多步顺序操作求起点时优先选用，包括多层繁分数自下而上化简。"
    - name: "分类讨论"
      desc: "按明确且互斥完备的标准将复杂情形拆分为若干子情况分别求解后汇总。"
      boundary: "枚举计数与多解几何/数论题的通用骨架。"
    - name: "极端思想"
      desc: "从极大值、极小值、最不利或边界临界状态切入，快速锁定取值范围或突破口。"
      boundary: "若题干出现“至少保证”并需人为划分抽屉，应同时标注“构造抽屉与最不利原则”。"
    - name: "构造法"
      desc: "通过直接给出满足条件的具体数阵、方案、图形切分或抽屉完成存在性或最值证明。"
      boundary: "用于回答“能否做到”“如何安排”或最值取等条件验证。"
    - name: "对应思想"
      desc: "在两类对象间建立一一对应（双射）关系，借更易求解的一方完成计数或算式求和。"
      boundary: "区别于普通公式套用：强调两类事物间的等价映射（如首尾配对、路线与01串对应）。"
    - name: "递推与归纳"
      desc: "从 n=1,2,3 等小规模特例入手观察规律，建立前后项递推关系推广至一般情形。"
      boundary: "区别于单纯枚举：核心在于找到从 f(n-1) 到 f(n) 的转移规则。"
    - name: "整体与换元"
      desc: "将重复出现的长式或局部图形视为一个整体，或设新字母代换以消去冗余结构。"
      boundary: "不仅用于代数计算（如长小数/分式换元），也用于应用题设中间量为整体。"
    - name: "数形结合"
      desc: "将纯算式与几何面积对应（如平方和拼图），或将数量关系画成图来直观求解。"
      boundary: "纯几何题本身不滥标此项；仅当“以数解形”或“以形助数”跨界明显时标注。"
    - name: "反证法"
      desc: "先假定命题结论不成立，经严谨逻辑推演导出矛盾，从而确立原结论必成立。"
      boundary: "多用于逻辑真假推理与数论/组合证明题，重在“引出逻辑矛盾”而非算术调差。"
    - name: "方程与代数法"
      desc: "设未知数并依据等量关系列一元方程、方程组或不定方程求解。"
      boundary: "当纯算术思路绕远、直接设元列式最清晰时使用。"

  专项解题模型与技巧:
    计算专项:
      - name: "凑整与运算律简算"
        desc: "利用交换律、结合律、乘法分配律（提取公因数）及添去括号实现凑整简算。"
        boundary: "适用于加减凑整、25×4/125×8 配对及乘法分配律正逆用。"
      - name: "裂项相消"
        desc: "将数列通项拆分为相邻两项（或间隔项）之差，使正负项逐一抵消。"
        boundary: "含单位分数裂差/裂和及连续整数乘积裂项。"
      - name: "公式套用与变形"
        desc: "直接应用或逆用等差/等比数列求和、平方差、完全平方及自然数平方和公式。"
        boundary: "仅指核心步骤依赖既定代数/数列公式的题目。"
      - name: "分组与配对求和"
        desc: "按奇偶、符号、周期或首尾规律将算式各项重新分组化简。"
        boundary: "区别于裂项：分组不拆开单项，而是合并组内和差。"
      - name: "放缩与估值"
        desc: "通过放大或缩小分子分母确定复杂和式的整数部分或上下界范围。"
        boundary: "专门针对求“整数部分”“约等于”或比较大小的计算题。"
      - name: "小数分数互化"
        desc: "将纯/混循环小数化分数，或分小数统一转化后再做约分与通分。"
        boundary: "专指循环小数或分小数混排需要数制统一转换的技巧。"

    应用与行程专项:
      - name: "线段图与比例份数"
        desc: "用线段长度或份数表示和、差、倍数及路程分段，锁定“1份量”求解。"
        boundary: "和差倍、年龄、盈亏与中年级行程的核心图解工具。"
      - name: "量率对应与统一单位1"
        desc: "找准具体数量对应的分率，或把多个不同基准的分率统一到同一单位“1”。"
        boundary: "分数应用题、利润率与工程效率分率转换专用。"
      - name: "十字交叉与混合配比"
        desc: "处理两类不同浓度溶液、利润率、平均数或鸡兔混合时的加权平均比例。"
        boundary: "仅用于“两个部分按不同比率混合成整体”的加权配比结构。"
      - name: "消元与代换法"
        desc: "通过加减消元或等量代换消除多余未知量。"
        boundary: "区别于整体换元：此处侧重两个不同物理量间的数量替换消元。"
      - name: "周期余数定位"
        desc: "先确定循环周期长度，再用带余除法依据余数锁定第 N 个位置或状态。"
        boundary: "适用于日历、周期工程交替、循环小数第 N 位及周期相遇。"
      - name: "相遇追及与相对速度"
        desc: "运用速度和/速度差及路程和/路程差模型处理直线、往返、过桥、错车与行船。"
        boundary: "所有相对运动行程的基础模型，含多次相遇中的路程倍数规律。"
      - name: "比例法解行程"
        desc: "利用路程、速度、时间中某一量相同（或成固定倍数），建立其余两量的正反比关系。"
        boundary: "区别于基本相遇追及公式：强调通过比例份数而非具体速度值突破。"

    几何专项:
      - name: "割补平移与等积变形"
        desc: "通过切割、拼接、平移、旋转、对称翻转或拉窗帘（等底等高）重构图形求周长面积。"
        boundary: "适用于不规则周长、曲线阴影（如叶形/容斥图形）及无需比例定理的面积重组。"
      - name: "共边与鸟头模型"
        desc: "利用同高三角形面积比等于底边比（共边定理/燕尾），或共角三角形面积比等于夹边乘积比。"
        boundary: "三角形面积比例最核心模型。"
      - name: "蝴蝶与沙漏相似模型"
        desc: "利用平行线构造金字塔或沙漏相似，及梯形/任意四边形对角线分出的蝴蝶翅膀比例。"
        boundary: "存在平行线交叉或任意四边形对角线面积乘积关系时优先使用。"
      - name: "一半模型"
        desc: "识别平行四边形、梯形或特定四边形中面积恒占图形总面积一半的三角形结构。"
        boundary: "高频独立模型，能快速解出大量四边形面积题。"
      - name: "弦图与勾股构造"
        desc: "通过构造直角三角形、赵爽弦图或补全大正方形，利用勾股定理打通边长与面积。"
        boundary: "含直角条件、斜放正方形或非规则角度（如45°/30°）作高构造直角三角形。"
      - name: "毕克定理与格点网格化"
        desc: "在正方形或三角形点阵中利用内点与边界点数算面积，或人为划分网格化归求解。"
        boundary: "仅用于点阵/格点背景或可网格剖分的直线图形。"
      - name: "三视图与立体展开分析"
        desc: "利用标面法判别展开图相对面、三视图还原小正方体个数、切片截面及染色面数统计。"
        boundary: "专用于非纯公式计算的立体空间构型分析题。"

    数论专项:
      - name: "整除特征与弃九观尾"
        desc: "应用 2/5/4/25/8/125 末位法、3/9 数字和法、11 奇偶位差法及 7/11/13 三位截断法。"
        boundary: "数论整除判别与数字谜填数筛选的核心工具。"
      - name: "位值展开与数字拆解"
        desc: "将多位数按十进制位值展开成代数式，以进行数字重排或数位约束消元。"
        boundary: "用于位值原理、数字之和及数论计数中的数位拆解。"
      - name: "分解质因数与指数分析"
        desc: "利用唯一分解定理分析质因数幂次，求因数个数/因数和、平方数特征或 GCD/LCM。"
        boundary: "质因数幂次与约数分析的核心工具。"
      - name: "同余与剩余定理"
        desc: "利用同余可加可乘幂性质、余数周期及中国剩余定理（大衍求一/逐步满足）求余数问题。"
        boundary: "专指需用同余变换或处理多除数余数条件的问题。"
      - name: "辗转相除法"
        desc: "通过反复带余相除求大数最大公因数，或利用 gcd(a,b)=gcd(b, a-kb) 化简代数式。"
        boundary: "当数字较大不便质因数分解或出现相邻代数式互质证明时使用。"
      - name: "奇偶分析"
        desc: "依据奇数与偶数的加减乘除奇偶守恒（或黑白染色奇偶校验）排除不可能情形。"
        boundary: "跨数论、逻辑、计数棋盘覆盖的高频轻量级方法。"

    计数与逻辑专项:
      - name: "容斥原理与韦恩图"
        desc: "利用二元/三元集合容斥公式消除重复计数，或利用韦恩图推算最少/最多重叠。"
        boundary: "计数与曲线阴影重叠面积计算均适用。"
      - name: "标数法与传球递推"
        desc: "在网格路口逐点累加路径数，或将环形染色/流转问题抽象为传球状态转移计数。"
        boundary: "专用于路线计数及相邻不同色的环形递推染色。"
      - name: "捆绑插空与挡板法"
        desc: "利用捆绑法处理相邻、插空法处理不相邻、挡板法处理同素分堆排列组合。"
        boundary: "经典排列组合模型三大核心招式。"
      - name: "构造抽屉与最不利原则"
        desc: "人为构造区间/剩余类/染色抽屉，或先取各抽屉极限未满状态再加1以保证成立。"
        boundary: "抽屉原理与“至少多少个才能保证”类题型的标准动作。"
      - name: "列表连线与矛盾排查"
        desc: "建立二维属性矩阵打钩叉、画关系连线图，并利用矛盾律/排中律锁定真假话唯一解。"
        boundary: "逻辑推理与认知真假问题的主力工具。"

difficulty:
  - level: 1
    name: "1-基础"
    desc: "单知识点直用，思维链不超过2步（1~2道“弯”）。"
    criteria:
      - "直接套用本节基础定义、基本公式或单一标准模型即可求解。"
      - "常见来源：基础例题、校内同步拓展常规题。"
  - level: 2
    name: "2-提高"
    desc: "标准变式或两步条件转化，思维链3~4步。"
    criteria:
      - "需先进行一次条件翻译、图形割补或单位“1”/比例转换，再套用核心模型。"
      - "常见来源：常规培优题、竞赛初赛中档题。"
  - level: 3
    name: "3-竞赛进阶"
    desc: "多知识点交叉或技巧较深，思维链5步以上。"
    criteria:
      - "涉及隐含不变量发掘、多模型联立（如比例+行程、几何模型+方程、数论+计数）或明显分类讨论。"
      - "常见来源：高年级进阶习题、各类数学竞赛复赛真题。"
  - level: 4
    name: "4-压轴挑战"
    desc: "强构造性、高度综合或极端抽象，思维跨度大。"
    criteria:
      - "需要自主构造抽屉/反例/辅助线/复杂状态转移，或涉及高阶数论推理、极值构造与严谨证明。"
      - "常见来源：各章拓展压轴题、高阶数学竞赛决赛压轴题。"

visual:
  - name: "纯文字"
    require_vision: false
    desc: "题干无配图，仅由文字与 LaTeX 数学表达式构成。"
    ocr_summary_hints: []
  - name: "几何图形"
    require_vision: true
    desc: "包含平面或立体几何示意图，图中标注了顶点、角度、阴影区域或关键尺寸。"
    ocr_summary_hints: ["text_image", "wireframe", "natural_image"]
  - name: "数阵与棋盘"
    require_vision: true
    desc: "包含九宫格、数阵图、点阵格点、火柴棒阵或棋盘方格布局。"
    ocr_summary_hints: ["text_image", "natural_image", "partition"]
  - name: "统计与数据表"
    require_vision: true
    desc: "包含柱状图、折线图、饼图/环图、雷达图等数据统计图表（注：纯 Markdown 表格可按纯文字处理，图片化表格标此项）。"
    ocr_summary_hints: ["bar", "bar_stacked", "area", "donut", "pie", "radar", "treemap", "funnel"]
  - name: "示意图与路线图"
    require_vision: true
    desc: "包含行程路线图、天平/操作流程图、逻辑关系图或实物情景插图。"
    ocr_summary_hints: ["flowchart", "natural_image", "text_image"]

format:
  - name: "计算题"
    desc: "直接给出算式要求化简求值。"
    regex_hints: ["^(计算|求值|简算)[:：]?", "=\\s*[_？?]+$"]
  - name: "填空题"
    desc: "题干含下划线空格或括号占位符，仅需给出最终数值或简短结论。"
    regex_hints: ["_{2,}", "（\\s*）", "\\(\\s*\\)"]
  - name: "解答题"
    desc: "完整应用题、几何求值或过程求解题，通常以“求……”“……是多少？”结尾。"
    regex_hints: ["(求|多少|几|何时|相距|面积是|速度是).*?[？?。]$"]
  - name: "操作构造题"
    desc: "要求画图、切拼、填数、染色或给出一种具体安排方案。"
    regex_hints: ["(请构造|写出一种|画出|填入|涂色|如何切|怎么分|安排方案)"]
  - name: "判断说理题"
    desc: "要求判断“能否/是否/谁对谁错”并说明理由或进行数学证明。"
    regex_hints: ["(证明|说明理由|是否正确|能不能|是否一定|谁是|真话|假话)"]

